allowBuilds:
  '@reown/appkit': false
  bufferutil: false
  esbuild: true
  keccak: false
  secp256k1: false
  utf-8-validate: false
# Privy's Solana peers (@solana-program/*) need @solana/kit ^8; without this
# pnpm resolves kit 5.x and the Next build fails on program-client-core.
overrides:
  '@solana/kit': ^8.6.0
minimumReleaseAgeExclude:
  - '@privy-io/api-base@2.1.0'
  - '@privy-io/chains@1.0.0'
  - '@privy-io/js-sdk-core@0.79.5'
  - '@privy-io/react-auth@3.51.4'
  - '@privy-io/routes@0.5.1'
  - '@privy-io/urls@0.0.6'
